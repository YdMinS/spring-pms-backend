spring:
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: test-secret-key-for-testing-only-must-be-32-bytes-long
  expiration: 3600000
  refresh-expiration: 1209600000
  prefix: Bearer

oklyx:
  crypto:
    # Fixed AES-256 key for tests (32-byte Base64)
    master-key: tsUz8XJ4zD1cfE6SCdKlpbvt/p0a8axnDaicVLugPw4=

# Override image storage to a writable, build-local dir for tests.
# Prod default (/app/uploads/products) is not writable in the test sandbox.
image:
  storage:
    uploadDir: build/test-uploads/products
    baseUrl: /api/products

server:
  tomcat:
    max-http-post-size: 20971520
    max-swallow-size: 20971520
