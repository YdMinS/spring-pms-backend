spring:
  application:
    name: spring-pms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    # Default OFF. Schema owner is Hibernate on local/test (create-drop); Liquibase only owns dev/prod.
    enabled: false
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  # Sentinel default(__UNSET__): env 미주입 시 placeholder resolution 단계에서 죽지 않고
  # StartupEnvironmentValidator 까지 도달해 "JWT_SECRET 필요" 라는 명확한 메시지로 중단시킨다.
  secret: ${JWT_SECRET:__UNSET__}
  expiration: 1800000          # 30m
  refresh-expiration: 1209600000   # 14d
  prefix: Bearer

oklyx:
  crypto:
    # AES-256 master key (32-byte Base64). Inject via OKLYX_CRYPTO_MASTER_KEY env var in prod/dev.
    # The default below is a boot-time placeholder — the real secret MUST be overridden via env var.
    master-key: ${OKLYX_CRYPTO_MASTER_KEY:P5m4nQbR+G+j8ekvlzQpnRgmSWgGSQWdJCzZCndLNew=}
  coupang:
    # Ordersheet list query (daily paging) GET_ORDERSHEET. {vendorId} is replaced with the account vendorId.
    ordersheets-path: /v2/providers/openapi/apis/api/v5/vendors/{vendorId}/ordersheets
    # Ordersheet query window (days): createdAtFrom = today − sync-days. Coupang caps the range at < 31 days.
    # Status is only refreshed for orders whose createdAt falls inside this window; orders that age out
    # freeze at their last status (e.g. ACCEPT/결제완료). Widening triggers Coupang 504s, so instead the
    # purchase-list view is also bounded to this same window (by paidAt) so stale rows are never shown.
    # The order-history view uses this window only as its DEFAULT — GET /api/orders?from=&to= reaches
    # past it for historical months, and the client is responsible for flagging that those rows are stale
    # (FEATURE_2609_08). Keep this in sync with the display filter in OrderQueryService/PurchaseListService.
    sync-days: 14
    # Lower bound (days) for the TERMINAL statuses (배송지시~추적불가) query window; sync-days is the upper bound.
    # Those statuses never move back, so re-reading a full 14-day window for them every run is pure waste.
    # The actual window = clamp(days since the last successful ordersheets sync + 1, this value, sync-days),
    # so a daily run reads 3 days and a long pause widens it automatically — no fixed number to tune.
    # ⚠️ Do not lower to 1: the window is a KST calendar-day range, so a midnight boundary would leave a
    # whole day uncovered. Active statuses (ACCEPT/INSTRUCT) always use the full sync-days window.
    terminal-sync-min-days: 3
    # INSTRUCT (상품준비중) query window (days) for the shipping-label spreadsheet only.
    # INSTRUCT orders are transitioned manually (by the seller in Coupang WING) well after the order
    # was created, so their createdAt is old — a narrow window drops current INSTRUCT orders and the
    # download comes back empty. Kept wide (Coupang caps the range at < 31 days).
    instruct-days: 30
    # Single-order ordersheet lookup GET_ORDERSHEET_BY_ORDER_ID. {vendorId}/{orderId} are replaced at call time.
    # Unlike the list query this path has no status condition, so an order in any status can be fetched
    # (that is why the single-order shipping sheet works regardless of order status).
    ordersheet-by-order-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/{orderId}/ordersheets
    # Acknowledgement (결제완료→상품준비중). Unverified against a live account — keep it overridable.
    acknowledgement-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/ordersheets/acknowledgement
    # Per-item (vendorItem) selling-price change. {vendorItemId}/{price} are replaced at call time; the new
    # price takes effect immediately (no re-approval).
    # ⚠️ seller_api, not openapi: this is a product API, so it lives in the same group as seller-products.
    # openapi here returns 404 PRECONDITION_FAILED from Coupang (verified against a live account 2026-09-05).
    # ⚠️ Do NOT append a forceSalePriceUpdate query string: put() takes no query argument and folding one into
    # the path breaks the HMAC signature.
    vendor-item-price-path: /v2/providers/seller_api/apis/api/v1/marketplace/vendor-items/{vendorItemId}/prices/{price}
    # Return/cancel request list query GET_RETURN_REQUEST_BY_QUERY (cancelType=CANCEL to reconcile paid-order cancellations).
    returnrequests-path: /v2/providers/openapi/apis/api/v6/vendors/{vendorId}/returnRequests
    # Return-withdrawal history by date range GET_RETURN_WITHDRAW_BY_DATE. Withdrawn return receipts simply
    # disappear from returnRequests, so this is the only signal that closes them (WITHDRAWN) instead of
    # letting them rot until the STALE sweep. Coupang caps this range at 7 days (both ends inclusive).
    # Unverified against a live account — keep it overridable.
    return-withdraw-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/returnWithdrawRequests
    # Cancel reconciliation window (days): wider than ordersheets to cover delayed cancellations. Coupang max 31 days.
    cancel-sync-days: 7
    # Claim processing actions (FEATURE_2609_21). Prefix is v4 - the return LIST above is v6, so copying
    # its prefix would 404 every action. Unverified against a live account -> keep them overridable.
    return-receive-confirm-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/returnRequests/{receiptId}/receiveConfirmation
    # Approving a return CONFIRMS THE REFUND. Irreversible, no sandbox - only the controller calls it.
    return-approval-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/returnRequests/{receiptId}/approval
    # Collect-invoice registration, shared by returns and exchanges (returnExchangeDeliveryType picks one).
    return-exchange-invoice-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/return-exchange-invoices/manual
    # Exchange actions (FEATURE_2609_21 / 05). Same v4-vs-lookup split as returns: the exchange LIST above is
    # api/v1/marketplace, so copying its prefix would 404 every action. Unverified against a live account ->
    # if all three 404 in dev, try the v1/marketplace prefix and record it in PLAN 6-1.
    exchange-receive-confirm-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/exchangeRequests/{exchangeId}/receiveConfirmation
    # Rejecting an exchange is irreversible. Reject codes (SOLDOUT / WITHDRAW) live in the adapter, not here.
    exchange-rejection-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/exchangeRequests/{exchangeId}/rejection
    # Reship invoice upload. Its shipmentBoxId is the NEW box created after receive-confirmation, not the
    # original one we stored, so the adapter re-queries the exchange right before sending.
    exchange-invoice-path: /v2/providers/openapi/apis/api/v4/vendors/{vendorId}/exchangeRequests/{exchangeId}/invoices
    # HTTP timeouts for every Coupang call. Without them a slow gateway pins the request thread forever,
    # so one hung call stalls the whole sync. Connect is short (TCP handshake); read is generous because
    # some queries (shipping-label sheets) legitimately take a while — generous, never unbounded.
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

image:
  storage:
    type: local
    uploadDir: /app/uploads/products
    baseUrl: /api/products
    maxFileSize: 20971520
    allowedMimeTypes: image/jpeg,image/png
    allowedExtensions: jpg,jpeg,png

server:
  port: 8083
  tomcat:
    max-http-post-size: 20971520
    max-swallow-size: 20971520

detail:
  font-face:
    # Emit @font-face in generated detail HTML. Turn off to stop font downloads (CSS fallback stack only)
    # without a redeploy, e.g. if a marketplace rejects the <style> block.
    enabled: true
