# Coupang 총 수량 per category and per listing (FEATURE_2610_34 / D2 · D6 · D10 · D11 · D14).
#   120-1 platform_category.grand_total_omitted = new Coupang registrations of this category leave 총 수량 out (D2 · D10).
#         Existing rows start false.
#   120-2 MySQL only: grand_total_omitted BOOLEAN -> BIT(1) (109-4 pattern — Hibernate validate expects BIT).
#   120-3 product_listing.grand_total_send = whether a revision sends 총 수량 (D6). Existing rows start SENT (D11 ①).
#   120-4 the 1,852 Coupang codes whose 총 수량 is a search option only in the 2026-08-24 category files (D10 · D14).
#         Rows of every tenant with platform COUPANG and one of these codes; a code missing from the table is skipped.
#         No rollback of the data — rolling back 120-1 drops the column.
databaseChangeLog:

  - changeSet:
      id: 120-1-platform-category-grand-total-omitted
      author: oclyx
      comment: "FEATURE_2610_34 D2 D10: platform_category.grand_total_omitted (BOOLEAN NOT NULL default false)."
      changes:
        - addColumn:
            tableName: platform_category
            columns:
              - column:
                  name: grand_total_omitted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn: { tableName: platform_category, columnName: grand_total_omitted }

  # MySQL only: abstract BOOLEAN -> TINYINT, but Hibernate expects BIT(1). Re-type + re-declare NOT NULL/DEFAULT
  # (MySQL MODIFY drops them). Mirrors 109-4. H2 untouched.
  - changeSet:
      id: 120-2-platform-category-grand-total-omitted-mysql-bit
      author: oclyx
      dbms: mysql
      comment: "platform_category.grand_total_omitted TINYINT -> BIT(1) to satisfy Hibernate schema validation."
      changes:
        - modifyDataType:
            tableName: platform_category
            columnName: grand_total_omitted
            newDataType: BIT(1)
        - addNotNullConstraint:
            tableName: platform_category
            columnName: grand_total_omitted
            columnDataType: BIT(1)
            defaultNullValue: false
        - addDefaultValue:
            tableName: platform_category
            columnName: grand_total_omitted
            defaultValueBoolean: false
      rollback:
        - modifyDataType:
            tableName: platform_category
            columnName: grand_total_omitted
            newDataType: BOOLEAN

  - changeSet:
      id: 120-3-product-listing-grand-total-send
      author: oclyx
      comment: "FEATURE_2610_34 D6 D11: product_listing.grand_total_send (VARCHAR(20) NOT NULL default SENT)."
      changes:
        - addColumn:
            tableName: product_listing
            columns:
              - column:
                  name: grand_total_send
                  type: VARCHAR(20)
                  defaultValue: SENT
                  constraints:
                    nullable: false
      rollback:
        - dropColumn: { tableName: product_listing, columnName: grand_total_send }

  - changeSet:
      id: 120-4-coupang-grand-total-search-only-codes
