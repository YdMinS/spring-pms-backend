# Purchase list per seller + purchase checks + stock link setting (FEATURE_2610_09 / D15 · D16 · D62 · D72 · D84 · D85).
#   109-1 deletes every manual line saved without a seller (order_line_id IS NULL) — no rollback, the deploy-gate
#         backup is the safety net (D15). Count them first:
#           SELECT COUNT(*) FROM shopping_list_item WHERE order_line_id IS NULL;
#   109-2 shopping_list_item.seller_id = the seller a manual line is bought for. Order lines keep NULL: their seller
#         comes from order -> account -> seller (D16).
#   109-3 purchase_check = one processing record per (product × seller): PURCHASED · NOT_NEEDED · TOMORROW · NEED_ZERO
#         (D62 · D85). A record is never deleted — cancelled_at marks it cancelled.
#   109-4 purchase_record.stock_linked = the stock link setting when the purchase was saved (D84). Existing rows were
#         saved while every purchase went to stock (2609_29 D19), so they backfill to true.
#   109-5 tenant_purchase_setting = one row per tenant; no row = stock link off (D69 · D72).
# ⚠️ stock_linked is BOOLEAN on both tables -> the 006 BIT follow-ups (dbms: mysql) below.
# ⚠️ H2 constraint names are schema-global unique -> table-prefixed names.
databaseChangeLog:

  - changeSet:
      id: 109-1-manual-line-delete
      author: oclyx
      comment: "FEATURE_2610_09 D15: delete manual lines saved without a seller."
      changes:
        - delete:
            tableName: shopping_list_item
            where: order_line_id IS NULL
      rollback: [] # the deleted lines had no seller; nothing to restore them from (D15)

  - changeSet:
      id: 109-2-shopping-list-item-seller
      author: oclyx
      comment: "FEATURE_2610_09 D16: shopping_list_item.seller_id (manual lines only)."
      changes:
        - addColumn:
            tableName: shopping_list_item
            columns:
              - column: { name: seller_id, type: BIGINT }
        - addForeignKeyConstraint:
            constraintName: fk_shoppinglistitem_seller
            baseTableName: shopping_list_item
            baseColumnNames: seller_id
            referencedTableName: seller
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint: { baseTableName: shopping_list_item, constraintName: fk_shoppinglistitem_seller }
        - dropColumn: { tableName: shopping_list_item, columnName: seller_id }

  - changeSet:
      id: 109-3-purchase-check
      author: oclyx
      comment: "FEATURE_2610_09 D62 · D85: purchase_check (processing records per product × seller)."
      changes:
        - createTable:
            tableName: purchase_check
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: checked_on, type: DATE, constraints: { nullable: false } }
              - column: { name: needed_qty, type: INT, constraints: { nullable: false } }
              - column: { name: cancelled_at, type: TIMESTAMP }
              - column: { name: created_by, type: VARCHAR(100) }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_purchasecheck_tenant
            baseTableName: purchase_check
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_purchasecheck_product
            baseTableName: purchase_check
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_purchasecheck_seller
            baseTableName: purchase_check
            baseColumnNames: seller_id
            referencedTableName: seller
            referencedColumnNames: id
        - createIndex:
            tableName: purchase_check
            indexName: idx_purchasecheck_product_seller
            columns:
              - column: { name: product_id }
              - column: { name: seller_id }
      rollback:
        - dropTable: { tableName: purchase_check }

  - changeSet:
      id: 109-4-purchase-record-stock-linked
      author: oclyx
      comment: "FEATURE_2610_09 D84: purchase_record.stock_linked (BOOLEAN NOT NULL default true, backfills existing rows)."
      changes:
        - addColumn:
            tableName: purchase_record
            columns:
              - column:
                  name: stock_linked
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
      rollback:
        - dropColumn: { tableName: purchase_record, columnName: stock_linked }

  # MySQL only: abstract BOOLEAN -> TINYINT, but Hibernate expects BIT(1). Re-type + re-declare NOT NULL/DEFAULT
  # (MySQL MODIFY drops them). Mirrors 028. H2 untouched.
  - changeSet:
      id: 109-4-purchase-record-stock-linked-mysql-bit
      author: oclyx
      dbms: mysql
      comment: "purchase_record.stock_linked TINYINT -> BIT(1) to satisfy Hibernate schema validation."
      changes:
        - modifyDataType:
            tableName: purchase_record
            columnName: stock_linked
            newDataType: BIT(1)
        - addNotNullConstraint:
            tableName: purchase_record
            columnName: stock_linked
            columnDataType: BIT(1)
            defaultNullValue: true
        - addDefaultValue:
            tableName: purchase_record
            columnName: stock_linked
            defaultValueBoolean: true
      rollback:
        - modifyDataType:
            tableName: purchase_record
            columnName: stock_linked
            newDataType: BOOLEAN

  - changeSet:
      id: 109-5-tenant-purchase-setting
      author: oclyx
      comment: "FEATURE_2610_09 D72: tenant_purchase_setting (one row per tenant, no row = stock link off)."
      changes:
        - createTable:
            tableName: tenant_purchase_setting
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: stock_linked, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_tenantpurchasesetting_tenant
            baseTableName: tenant_purchase_setting
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_tenant_purchase_setting_tenant
            tableName: tenant_purchase_setting
            columnNames: tenant_id
      rollback:
        - dropTable: { tableName: tenant_purchase_setting }

  - changeSet:
      id: 109-5-tenant-purchase-setting-mysql-bit
      author: oclyx
      dbms: mysql
      comment: "tenant_purchase_setting.stock_linked TINYINT -> BIT(1) to satisfy Hibernate schema validation."
      changes:
        - modifyDataType:
            tableName: tenant_purchase_setting
            columnName: stock_linked
            newDataType: BIT(1)
        - addNotNullConstraint:
            tableName: tenant_purchase_setting
            columnName: stock_linked
            columnDataType: BIT(1)
      rollback:
        - modifyDataType:
            tableName: tenant_purchase_setting
            columnName: stock_linked
            newDataType: BOOLEAN
