# LotteON shipping settings per sales channel (FEATURE_2610_24 / D42 · D65).
#   lotteon_shipping_config = the channel layer of the LotteON shipping keys, 1:1 with marketplace_account, next to
#   coupang_shipping_config / elevenst_shipping_config / esm_shipping_config. The values are ONE map (settings, JSON
#   TEXT) whose keys are exactly the listing override keys ("lotteon.*", LotteonShippingKeys).
# ⚠️ No boolean column -> the 006 BIT follow-up is not needed.
databaseChangeLog:

  - changeSet:
      id: 128-lotteon-shipping-config
      author: oclyx
      comment: "FEATURE_2610_24: lotteon_shipping_config (1:1 with marketplace_account, UNIQUE)."
      changes:
        - createTable:
            tableName: lotteon_shipping_config
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: settings, type: TEXT }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_shipcfg_tenant
            baseTableName: lotteon_shipping_config
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_shipcfg_account
            baseTableName: lotteon_shipping_config
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_lotteon_shipcfg_account
            tableName: lotteon_shipping_config
            columnNames: marketplace_account_id
      rollback:
        - dropTable: { tableName: lotteon_shipping_config }
