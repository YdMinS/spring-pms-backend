# Receipt intake + seller cards (FEATURE_2610_18 / D28 · D29 · D52 · D87 · D91 · D93).
#   110-1 seller_card = payment cards registered under a seller. masked_number = the masked number printed on
#         receipts (a full card number is rejected by the service, D92). hidden_at set = deleted (hidden) card (D91).
#   110-2 purchase_receipt = one receipt photo = one check-in of several products (D28). payer_seller_id = the seller
#         who paid (card owner, or picked by hand when the card is unknown — D87). card_id NULL = no registered card.
#   110-3 purchase_record.receipt_id = the receipt a purchase line came in with. NULL = per-product check-in (D75).
#         No separate index: MySQL and H2 index a foreign key column on their own.
# ⚠️ No BOOLEAN column here -> no MySQL BIT follow-up changeSet (hidden_at is a TIMESTAMP).
# ⚠️ H2 constraint names are schema-global unique -> table-prefixed names.
databaseChangeLog:

  - changeSet:
      id: 110-1-seller-card
      author: oclyx
      comment: "FEATURE_2610_18 D29 · D52 · D91: seller_card (masked card numbers per seller)."
      changes:
        - createTable:
            tableName: seller_card
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: alias, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: masked_number, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: hidden_at, type: TIMESTAMP }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_sellercard_tenant
            baseTableName: seller_card
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_sellercard_seller
            baseTableName: seller_card
            baseColumnNames: seller_id
            referencedTableName: seller
            referencedColumnNames: id
      rollback:
        - dropTable: { tableName: seller_card }

  - changeSet:
      id: 110-2-purchase-receipt
      author: oclyx
      comment: "FEATURE_2610_18 D28 · D45 · D87: purchase_receipt (one receipt photo per check-in)."
      changes:
        - createTable:
            tableName: purchase_receipt
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: purchased_on, type: DATE, constraints: { nullable: false } }
              - column: { name: payer_seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: card_id, type: BIGINT }
              - column: { name: photo_url, type: VARCHAR(1000), constraints: { nullable: false } }
              - column: { name: created_by, type: VARCHAR(100) }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_purchasereceipt_tenant
            baseTableName: purchase_receipt
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_purchasereceipt_payer_seller
            baseTableName: purchase_receipt
            baseColumnNames: payer_seller_id
            referencedTableName: seller
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_purchasereceipt_card
            baseTableName: purchase_receipt
            baseColumnNames: card_id
            referencedTableName: seller_card
            referencedColumnNames: id
        - createIndex:
            tableName: purchase_receipt
            indexName: idx_purchasereceipt_purchased_on
            columns:
              - column: { name: purchased_on }
      rollback:
        - dropTable: { tableName: purchase_receipt }

  - changeSet:
      id: 110-3-purchase-record-receipt
      author: oclyx
      comment: "FEATURE_2610_18 D93: purchase_record.receipt_id (NULL = per-product check-in)."
      changes:
        - addColumn:
            tableName: purchase_record
            columns:
              - column: { name: receipt_id, type: BIGINT }
        - addForeignKeyConstraint:
            constraintName: fk_purchaserecord_receipt
            baseTableName: purchase_record
            baseColumnNames: receipt_id
            referencedTableName: purchase_receipt
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint: { baseTableName: purchase_record, constraintName: fk_purchaserecord_receipt }
        - dropColumn: { tableName: purchase_record, columnName: receipt_id }
