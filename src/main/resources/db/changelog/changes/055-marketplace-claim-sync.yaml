# Claim sync anchor (FEATURE_2609_18 / D6·D18). The claim query window is a delta window: it starts at the
# last run that finished BOTH ingest and open-claim tracking, so an account that has been idle widens on its
# own instead of silently losing the days it slept through.
# ⚠️ Nullable with NO default and NO backfill on purpose: NULL means "never completed a claim run yet", which
#    makes the first run fall back to the cancel-sync-days window (today's behaviour, D6).
# ⚠️ This is the last time the stage COMPLETED — a failed tracking run leaves it untouched (D18) so the next
#    run's window automatically covers whatever was missed.
# No boolean column here -> the 006 MySQL BIT follow-up changeset is deliberately NOT needed.
databaseChangeLog:

  - changeSet:
      id: 055-marketplace-claim-sync
      author: oclyx
      comment: "FEATURE_2609_18: last_claim_sync_at on marketplace_account (delta window anchor, D6·D18)."
      changes:
        - addColumn:
            tableName: marketplace_account
            columns:
              - column: { name: last_claim_sync_at, type: TIMESTAMP }
      rollback:
        - dropColumn: { tableName: marketplace_account, columnName: last_claim_sync_at }
