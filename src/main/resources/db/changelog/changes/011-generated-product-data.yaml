# Generated product data (FEATURE_2608_06 / 3b-2, Design 2): 1:1 auto-generated assets per channel
# cell (product_listing). FK = product_listing_id (NOT Design 1's channel_listing_id); UNIQUE per cell.
# No @TenantId column — isolation flows through the parent product_listing. No boolean columns.
# Structured tags for H2<->MySQL portability.
databaseChangeLog:

  - changeSet:
      id: 011-generated-product-data
      author: oclyx
      comment: "3b-2: generated_product_data (1:1 with product_listing) — thumbnail_url / detail_html / template_id / generated_at."
      changes:
        - createTable:
            tableName: generated_product_data
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_listing_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: thumbnail_url, type: VARCHAR(1024) }
              - column: { name: detail_html, type: TEXT }
              - column: { name: template_id, type: BIGINT }
              - column: { name: generated_at, type: TIMESTAMP }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_gpd_listing
            baseTableName: generated_product_data
            baseColumnNames: product_listing_id
            referencedTableName: product_listing
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: generated_product_data
            columnNames: product_listing_id
            constraintName: uq_gpd_listing
