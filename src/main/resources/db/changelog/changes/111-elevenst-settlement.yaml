# 11st settlement (FEATURE_2610_20 / D3 · D16).
#   111-1 elevenst_settlement_line = the 11st mirror of one settlement_line (1:1, UNIQUE settlement_line_id).
#         One column per kept field of the 11st settlement list row (the 46 fields of D16 — no member id / name),
#         amounts DECIMAL(15,2) · dates DATE · the rest VARCHAR, plus raw = the same kept fields as XML.
#         stl_pln_dy (11st remittance date) is the key ElevenstPayoutBuilder groups payouts by (D29).
# ⚠️ No BOOLEAN column -> no MySQL BIT follow-up changeSet.
# ⚠️ H2 constraint names are schema-global unique -> table-prefixed names.
databaseChangeLog:

  - changeSet:
      id: 111-1-elevenst-settlement-line
      author: oclyx
      comment: "FEATURE_2610_20 D3 · D16: elevenst_settlement_line (11st mirror of settlement_line, 46 kept fields + raw)."
      changes:
        - createTable:
            tableName: elevenst_settlement_line
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: settlement_line_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: ord_no, type: VARCHAR(100) }
              - column: { name: ord_prd_seq, type: VARCHAR(50) }
              - column: { name: dlv_no, type: VARCHAR(100) }
              - column: { name: clm_req_seq, type: VARCHAR(100) }
              - column: { name: prd_no, type: VARCHAR(100) }
              - column: { name: seller_prd_no, type: VARCHAR(100) }
              - column: { name: prd_nm, type: VARCHAR(500) }
              - column: { name: slct_prd_opt_nm, type: VARCHAR(500) }
              - column: { name: ord_qty, type: VARCHAR(20) }
              - column: { name: fee_type_nm, type: VARCHAR(100) }
              - column: { name: ord_stl_end_dt, type: DATE }
              - column: { name: pocnfrm_dt, type: DATE }
              - column: { name: snd_end_dt, type: DATE }
              - column: { name: trt_end_dt, type: DATE }
              - column: { name: stl_dy, type: DATE }
              - column: { name: stl_pln_dy, type: DATE }
              - column: { name: sel_prc, type: "DECIMAL(15,2)" }
              - column: { name: opt_amt, type: "DECIMAL(15,2)" }
              - column: { name: sel_prc_amt, type: "DECIMAL(15,2)" }
              - column: { name: sel_fee, type: "DECIMAL(15,2)" }
              - column: { name: sel_fixed_fee, type: VARCHAR(20) }
              - column: { name: deduct_amt, type: "DECIMAL(15,2)" }
              - column: { name: stl_amt, type: "DECIMAL(15,2)" }
              - column: { name: cupn_amt, type: "DECIMAL(15,2)" }
              - column: { name: seller_cupn_amt, type: "DECIMAL(15,2)" }
              - column: { name: tmall_apply_dsc_amt, type: "DECIMAL(15,2)" }
              - column: { name: card_dsc_seller_dfrm_amt, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_multi_dsc_cst, type: "DECIMAL(15,2)" }
              - column: { name: sbdsc_seller_dfrm_amt_sum, type: "DECIMAL(15,2)" }
              - column: { name: sbdsc_flctn_stl_amt, type: "DECIMAL(15,2)" }
              - column: { name: tmall_over_dsc_amt, type: "DECIMAL(15,2)" }
              - column: { name: dlv_amt, type: "DECIMAL(15,2)" }
              - column: { name: bm_stl_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: clm_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: add_clm_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: clm_fst_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: bm_clm_fst_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: abrd_cn_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_app_dlv_amt, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_deferred_ad_fee, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_intfree_fee, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_ocb_amt, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_pnt_prd, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_gbl_dlv_fee, type: "DECIMAL(15,2)" }
              - column: { name: seller_dfrm_gbl_cn_dlv_cst, type: "DECIMAL(15,2)" }
              - column: { name: deba_gtn_stl_amt, type: "DECIMAL(15,2)" }
              - column: { name: raw, type: CLOB }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_elevenst_stlline_tenant
            baseTableName: elevenst_settlement_line
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_elevenst_stlline_line
            baseTableName: elevenst_settlement_line
            baseColumnNames: settlement_line_id
            referencedTableName: settlement_line
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_elevenst_stlline_account
            baseTableName: elevenst_settlement_line
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_elevenst_settlement_line
            tableName: elevenst_settlement_line
            columnNames: settlement_line_id
      rollback:
        - dropTable: { tableName: elevenst_settlement_line }
