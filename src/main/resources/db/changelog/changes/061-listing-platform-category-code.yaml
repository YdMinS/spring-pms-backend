# 가져오기 시점의 마켓 원본 카테고리 코드 (FEATURE_2609_22 / D16).
# 쿠팡에서 상품을 가져올 때 응답의 displayCategoryCode 를 그대로 보관한다 — **표시·비교 전용**이다.
# ⚠️ 등록·수정 payload 의 displayCategoryCode 는 계속 마스터 카테고리에서 해석한다(D14,
# MasterChannelConfigService.resolvePlatformCategoryCode). 이 컬럼을 payload 에 쓰면 두 소스가 갈라진다.
# 기존 행은 전부 NULL = "가져오기로 만들어진 셀이 아님" → 백필 없음.
databaseChangeLog:

  - changeSet:
      id: 061-listing-platform-category-code
      author: oclyx
      comment: "2609_22/D16: product_listing.platform_category_code (마켓 원본 카테고리, 표시·비교 전용)."
      changes:
        - addColumn:
            tableName: product_listing
            columns:
              - column: { name: platform_category_code, type: VARCHAR(50) }    # null = 가져오기 셀 아님
      rollback:
        - dropColumn: { tableName: product_listing, columnName: platform_category_code }
