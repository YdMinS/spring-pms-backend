# Carrier code catalog (FEATURE_2609_37 / PLAN D1 · D2 · D3 · D4 · D5 · D10).
#   carrier_catalog = every delivery company code a platform accepts (platform x code -> name).
# 🔴 This table is now the ONLY source of carrier codes: the hardcoded Java courier-code table is
#    deleted in the same change. The single-shipment dropdown and the whitelist that guards invoice upload
#    both read it, so a missing row means a 400 for a code the platform would have accepted.
# 🔴 Updates happen through a NEW CHANGESET ONLY (D3): there is no admin CRUD and no screen for this table.
#    A retired code is DELETED by a later changeset — there is deliberately no is_active column (D5), which
#    also keeps the MySQL BOOLEAN/BIT(1) trap (006/064) out of this table.
# 🔴 No tenant_id (D2): "CJ대한통운 is CJGLS on Coupang" cannot differ per tenant, and the sibling lookups
#    (carrier / platform_carrier_code, changeset 001) carry no tenant either. No audit columns — the entity
#    does not extend BaseEntity, and ddl-auto: validate would crash on boot if the columns disagreed.
# ⚠️ display_order is per platform (D4): the 17 rows the web UI used to pin to the top get 10..170 (that
#    curated order), every remaining row gets 1000+ in Coupang's own document order. Names are copied
#    VERBATIM from the document table (D10) — the "name (code)" label seen on screen is built by the
#    frontend (D14), so never bake a code into name here.
# ⚠️ HYUNDAI (롯데택배) and LOTTEGLOBAL (롯데글로벌) must BOTH stay: which one a Coupang account matches
#    differs per account (verified on a live account 2026-08-30); dropping either 400s the channels stored
#    with that code.
databaseChangeLog:

  - changeSet:
      id: 087-carrier-catalog
      author: oclyx
      comment: "FEATURE_2609_37: carrier_catalog table + Coupang courier code seed (198 rows)."
      changes:

        # ---- 1. the catalog itself (no tenant_id, no is_active, no audit columns) ----
        - createTable:
            tableName: carrier_catalog
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: platform, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: display_order, type: INT, constraints: { nullable: false } }
        - addUniqueConstraint:
            constraintName: uq_carrier_catalog_platform_code
            tableName: carrier_catalog
            columnNames: "platform, code"

        # ---- 2. Coupang seed: the document table verbatim, in document order (D10 · D10-1) ----
