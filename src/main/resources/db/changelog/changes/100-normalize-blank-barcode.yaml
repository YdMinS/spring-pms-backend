# Turn empty-string barcodes into NULL, so the unique key can be added.
#
# WHAT THIS CHANGES — exactly one column on one set of rows:
#     products.barcode_id  ->  NULL     for every row where barcode_id = ''.
#   Rows that already hold NULL are not touched. Rows with a real barcode are not touched. No row is
#   deleted, no other column is written.
#
# 🔴 WHY — 2026-09-23 프로덕션 실장애의 직접 원인이다.
#   MySQL 의 UNIQUE 키는 NULL 중복은 얼마든지 허용하지만 '' 는 평범한 값으로 취급한다. 바코드가 빈
#   문자열인 물품이 여러 개였기 때문에 098 의 addUniqueConstraint 가 다음과 같이 죽었다:
#       Duplicate entry '1-' for key 'products.uq_products_tenant_barcode'   (tenant_id=1 + '')
#   098 의 preCondition 은 중복을 셀 때 `barcode_id IS NOT NULL AND barcode_id <> ''` 로 **빈 문자열을
#   제외**했다. 그래서 검사는 통과했는데 실제 제약은 그 행들을 세어 1062 로 실패했다 — preCondition 의
#   기준과 실제 제약의 기준이 어긋난 것이 근본 원인이다. 앱(ProductServiceImpl.normalizeBarcode)은 이미
#   blank 를 null 로 바꾸므로, 남은 '' 는 그 규칙이 생기기 전의 레거시 행들뿐이다.
#
# ⚠️ ORDER: 반드시 098 보다 먼저 실행된다(master changelog 의 include 순서를 보라). 098 뒤로 옮기면
#    같은 1062 로 다시 배포가 멈춘다.
#
# ⚠️ 멱등하다. 두 번 돌아도 무해하다 — 이미 NULL 인 행은 WHERE 에 걸리지 않으므로 대상이 0건이다.
#
# 🔴 ROLLBACK 은 일부러 no-op(empty) 이다. '' 와 NULL 은 둘 다 "바코드 없음"이라는 같은 뜻이라 되돌릴
#    정보가 존재하지 않는다. 되돌리는 UPDATE 를 쓰면 원래부터 NULL 이던 1천여 행까지 '' 로 만들어 버려
#    오히려 데이터를 망가뜨린다. 099 처럼 백업 표를 만들 가치도 없다(잃는 정보가 없다).
databaseChangeLog:

  - changeSet:
      id: 100-normalize-blank-barcode
      author: oclyx
      comment: "products.barcode_id '' -> NULL; blank and NULL both mean 'no barcode', so the unique key can ignore them."
      changes:
        - sql:
            sql: >-
              UPDATE products SET barcode_id = NULL WHERE barcode_id = ''
      # 되돌릴 정보가 없다 — 위 주석 참고. `empty` = "롤백은 아무것도 하지 않는다"는 명시적 선언이며,
      # 롤백 불가(예외)가 아니라 성공적으로 아무 일도 하지 않고 끝난다.
      rollback:
        - empty:
