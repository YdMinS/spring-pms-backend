# Seller stock lots and debts (FEATURE_2610_19 / D42 · D51 · D90 · D105 · D130 · D131 · D143 · D146).
#   122-1 stock_movement: seller_id nullable (undecided intake, D105) · source_movement_id = the lot row an outgoing or
#         returned row used (D42) · price_filled_at = unit price typed later on the debt screen (D143 ①) ·
#         base_price_filled_at = that typed price also filled the empty registered price (D146 ①).
#   122-2 purchase_record: seller_id nullable (undecided intake, D105) · source_movement_id = the undecided intake row
#         this assigned purchase came from (D130 ①) · price_filled_at (D143 ①).
#   122-3 seller_debt = one borrowed share of an outbound row, rewritten per product (D51 · D111 · D132).
#   122-4 seller_settlement = a cash settlement written by a person (D90). cancelled_at set = cancelled.
#   122-5 lot_share_usage = how an undecided intake row's outgoing rows split over its owners (D131).
# ⚠️ No BOOLEAN column here -> no MySQL BIT follow-up changeSet (every flag is a TIMESTAMP).
# ⚠️ H2 constraint names are schema-global unique -> table-prefixed names.
databaseChangeLog:

  - changeSet:
      id: 122-1-stock-movement-lot
      author: oclyx
      comment: "FEATURE_2610_19 D42 · D105 · D143 · D146: stock_movement lot columns."
      changes:
        - dropNotNullConstraint: { tableName: stock_movement, columnName: seller_id, columnDataType: BIGINT }
        - addColumn:
            tableName: stock_movement
            columns:
              - column: { name: source_movement_id, type: BIGINT }
              - column: { name: price_filled_at, type: TIMESTAMP }
              - column: { name: base_price_filled_at, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_stockmovement_source
            baseTableName: stock_movement
            baseColumnNames: source_movement_id
            referencedTableName: stock_movement
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint: { baseTableName: stock_movement, constraintName: fk_stockmovement_source }
        - dropColumn: { tableName: stock_movement, columnName: base_price_filled_at }
        - dropColumn: { tableName: stock_movement, columnName: price_filled_at }
        - dropColumn: { tableName: stock_movement, columnName: source_movement_id }
        - addNotNullConstraint: { tableName: stock_movement, columnName: seller_id, columnDataType: BIGINT }

  - changeSet:
      id: 122-2-purchase-record-lot
      author: oclyx
      comment: "FEATURE_2610_19 D105 · D130 · D143: purchase_record undecided seller and assignment source."
      changes:
        - dropNotNullConstraint: { tableName: purchase_record, columnName: seller_id, columnDataType: BIGINT }
        - addColumn:
            tableName: purchase_record
            columns:
              - column: { name: source_movement_id, type: BIGINT }
              - column: { name: price_filled_at, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_purchaserecord_source_movement
            baseTableName: purchase_record
            baseColumnNames: source_movement_id
            referencedTableName: stock_movement
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint: { baseTableName: purchase_record, constraintName: fk_purchaserecord_source_movement }
        - dropColumn: { tableName: purchase_record, columnName: price_filled_at }
        - dropColumn: { tableName: purchase_record, columnName: source_movement_id }
        - addNotNullConstraint: { tableName: purchase_record, columnName: seller_id, columnDataType: BIGINT }

  - changeSet:
      id: 122-3-seller-debt
      author: oclyx
      comment: "FEATURE_2610_19 D51 · D111 · D132 · D137: seller_debt (borrowed outbound shares)."
      changes:
        - createTable:
            tableName: seller_debt
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: product_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: borrower_seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: lender_seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: out_movement_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: source_movement_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: share_record_id, type: BIGINT }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
              - column: { name: unit_price, type: "DECIMAL(15,4)" }
              - column: { name: amount, type: "DECIMAL(15,2)" }
              - column: { name: moved_on, type: DATE, constraints: { nullable: false } }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_tenant, baseTableName: seller_debt, baseColumnNames: tenant_id, referencedTableName: tenant, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_product, baseTableName: seller_debt, baseColumnNames: product_id, referencedTableName: products, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_borrower, baseTableName: seller_debt, baseColumnNames: borrower_seller_id, referencedTableName: seller, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_lender, baseTableName: seller_debt, baseColumnNames: lender_seller_id, referencedTableName: seller, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_out_movement, baseTableName: seller_debt, baseColumnNames: out_movement_id, referencedTableName: stock_movement, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_source_movement, baseTableName: seller_debt, baseColumnNames: source_movement_id, referencedTableName: stock_movement, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellerdebt_share_record, baseTableName: seller_debt, baseColumnNames: share_record_id, referencedTableName: purchase_record, referencedColumnNames: id }
      rollback:
        - dropTable: { tableName: seller_debt }

  - changeSet:
      id: 122-4-seller-settlement
      author: oclyx
      comment: "FEATURE_2610_19 D90 · D99 ①: seller_settlement (cash settlements, cancel = cancelled_at)."
      changes:
        - createTable:
            tableName: seller_settlement
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: payer_seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: receiver_seller_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: settled_on, type: DATE, constraints: { nullable: false } }
              - column: { name: amount, type: "DECIMAL(15,2)", constraints: { nullable: false } }
              - column: { name: memo, type: VARCHAR(500) }
              - column: { name: cancelled_at, type: TIMESTAMP }
              - column: { name: created_by, type: VARCHAR(100) }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint: { constraintName: fk_sellersettlement_tenant, baseTableName: seller_settlement, baseColumnNames: tenant_id, referencedTableName: tenant, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellersettlement_payer, baseTableName: seller_settlement, baseColumnNames: payer_seller_id, referencedTableName: seller, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_sellersettlement_receiver, baseTableName: seller_settlement, baseColumnNames: receiver_seller_id, referencedTableName: seller, referencedColumnNames: id }
      rollback:
        - dropTable: { tableName: seller_settlement }

  - changeSet:
      id: 122-5-lot-share-usage
      author: oclyx
      comment: "FEATURE_2610_19 D131: lot_share_usage (outgoing rows of an undecided intake row split per owner)."
      changes:
        - createTable:
            tableName: lot_share_usage
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: in_movement_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: out_movement_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: share_record_id, type: BIGINT }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
        - addForeignKeyConstraint: { constraintName: fk_lotshareusage_tenant, baseTableName: lot_share_usage, baseColumnNames: tenant_id, referencedTableName: tenant, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_lotshareusage_in_movement, baseTableName: lot_share_usage, baseColumnNames: in_movement_id, referencedTableName: stock_movement, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_lotshareusage_out_movement, baseTableName: lot_share_usage, baseColumnNames: out_movement_id, referencedTableName: stock_movement, referencedColumnNames: id }
        - addForeignKeyConstraint: { constraintName: fk_lotshareusage_share_record, baseTableName: lot_share_usage, baseColumnNames: share_record_id, referencedTableName: purchase_record, referencedColumnNames: id }
      rollback:
        - dropTable: { tableName: lot_share_usage }
