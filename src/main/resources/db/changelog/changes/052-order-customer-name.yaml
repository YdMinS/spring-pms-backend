# Customer names on the order line (FEATURE_2609_06 / D1·D2). Coupang exposes orderer/receiver on the
# shipmentBox, not on the order line, so the box-level value is duplicated onto every line of that box —
# an order/box table just to de-duplicate two short strings is not worth the join.
# ⚠️ Nullable with NO default and NO backfill on purpose (D6): the next sync's upsert fills every order
#    inside the sync window, and orders older than that window legitimately stay NULL.
# ⚠️ Names only — phone, address and delivery message stay out of the DB (D3).
# No boolean column here -> the 006 MySQL BIT follow-up changeset is deliberately NOT needed.
databaseChangeLog:

  - changeSet:
      id: 052-order-customer-name
      author: oclyx
      comment: "FEATURE_2609_06: order_item orderer_name/receiver_name (nullable, no backfill)."
      changes:
        - addColumn:
            tableName: order_item
            columns:
              - column: { name: orderer_name, type: VARCHAR(100) }
              - column: { name: receiver_name, type: VARCHAR(100) }
      rollback:
        - dropColumn: { tableName: order_item, columnName: orderer_name }
        - dropColumn: { tableName: order_item, columnName: receiver_name }
