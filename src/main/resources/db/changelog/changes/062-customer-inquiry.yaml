# Customer inquiries (FEATURE_2609_23 / PLAN §3 · D1).
#   customer_inquiry holds BOTH Coupang inquiry kinds (product Q&A and call-center) in one table, told apart by
#   inquiry_type (D1). The two API responses do not share a single field, but what actually differs is parsing
#   and sending — storage and screens are one (same reasoning as order_claim).
#   inquiry_type MUST be part of the unique key: the two kinds come from different id sequences, so the same
#   inquiryId value can appear in both (this is the mistake 056 had to fix for order_claim after the fact).
#   order_item_id / product_listing_id are NULLABLE on purpose (D15): product Q&A is mostly pre-purchase, so an
#   unlinked inquiry is normal, not a defect — it is stored unlinked rather than dropped.
# ⚠️ PII: no buyer phone, no buyer email (D13). author_name is the Coupang AGENT's name, not the customer's.
# ⚠️ No boolean column here -> the 006 MySQL BIT follow-up changeset is deliberately NOT needed.
# ⚠️ H2 constraint names are schema-global unique -> distinct names (fk_inquiry_*, uq_inquiry_*).
databaseChangeLog:

  - changeSet:
      id: 062-customer-inquiry
      author: oclyx
      comment: "FEATURE_2609_23: customer_inquiry + customer_inquiry_reply (order_item_id/product_listing_id nullable)."
      changes:
        - createTable:
            tableName: customer_inquiry
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: platform, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: inquiry_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: external_inquiry_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: external_item_id, type: VARCHAR(100) }
              - column: { name: external_order_id, type: VARCHAR(100) }
              - column: { name: external_product_id, type: VARCHAR(100) }
              - column: { name: product_listing_id, type: BIGINT }
              - column: { name: order_item_id, type: BIGINT }
              - column: { name: item_name, type: VARCHAR(500) }
              - column: { name: content, type: TEXT }
              - column: { name: category, type: VARCHAR(100) }
              - column: { name: status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: platform_status, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: inquired_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: answered_at, type: TIMESTAMP }
              - column: { name: last_synced_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_inquiry_tenant
            baseTableName: customer_inquiry
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_inquiry_account
            baseTableName: customer_inquiry
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_inquiry_orderitem
            baseTableName: customer_inquiry
            baseColumnNames: order_item_id
            referencedTableName: order_item
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_inquiry_listing
            baseTableName: customer_inquiry
            baseColumnNames: product_listing_id
            referencedTableName: product_listing
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_inquiry_account_type_external
            tableName: customer_inquiry
            columnNames: marketplace_account_id, inquiry_type, external_inquiry_id
        # Serves both the sync anchor (oldest UNANSWERED per account, D8) and the list ordering.
        - createIndex:
            tableName: customer_inquiry
            indexName: idx_inquiry_account_status_inquired
            columns:
              - column: { name: marketplace_account_id }
              - column: { name: status }
              - column: { name: inquired_at }

        - createTable:
            tableName: customer_inquiry_reply
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: customer_inquiry_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: external_reply_id, type: VARCHAR(100), constraints: { nullable: false } }
              # parentAnswerId — required by the call-center reply payload (04), so it must be kept at read time.
              - column: { name: parent_external_reply_id, type: VARCHAR(100) }
              - column: { name: author_role, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: author_name, type: VARCHAR(100) }
              - column: { name: content, type: TEXT }
              - column: { name: transfer_status, type: VARCHAR(50) }
              - column: { name: replied_at, type: TIMESTAMP }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_inquiry_reply_tenant
            baseTableName: customer_inquiry_reply
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_inquiry_reply_inquiry
            baseTableName: customer_inquiry_reply
            baseColumnNames: customer_inquiry_id
            referencedTableName: customer_inquiry
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_inquiry_reply_inquiry_external
            tableName: customer_inquiry_reply
            columnNames: customer_inquiry_id, external_reply_id
      rollback:
        - dropTable: { tableName: customer_inquiry_reply }
        - dropTable: { tableName: customer_inquiry }
