  # ---- tenantize existing single unique constraints -> composite (tenant_id, ...) ----
  # Only member.email and seller.business_registration have single-column unique constraints.
  # order_item / shopping_list_item uniques already sit under a tenant-owned FK parent -> unchanged.
  - changeSet:
      id: 002-tenant-unique-member-email
      author: oclyx
      comment: "member.email unique -> tenant-scoped: same email allowed in different tenants"
      changes:
        - dropUniqueConstraint: { tableName: member, constraintName: uq_member_email }
        - addUniqueConstraint:
            tableName: member
            columnNames: "tenant_id, email"
            constraintName: uq_member_tenant_email

  - changeSet:
      id: 002-tenant-unique-seller-biz
      author: oclyx
      comment: "seller.business_registration unique -> tenant-scoped"
      changes:
        - dropUniqueConstraint: { tableName: seller, constraintName: uq_seller_business_registration }
        - addUniqueConstraint:
            tableName: seller
            columnNames: "tenant_id, business_registration"
            constraintName: uq_seller_tenant_biz
