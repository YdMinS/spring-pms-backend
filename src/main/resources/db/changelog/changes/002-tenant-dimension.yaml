# Tenant dimension (SaaS Step -1): tenant table + tenant_id on tenant-owned tables.
# Schema only — Hibernate @TenantId isolation filter comes in changeset-adjacent code (02/03).
# Structured tags only (no raw SQL) for H2<->MySQL portability. Ids prefixed 002-tenant-*.
# Expand-contract order: tenant table+seed first, then per-table (nullable add -> backfill=1 ->
# NOT NULL -> FK), then tenantize existing single unique constraints into composite (tenant_id, ...).
# Backfill = PLAN §10 scenario A (all existing rows -> tenant 1), so UPDATE has no WHERE clause.
databaseChangeLog:

  # ---- tenant table + default seed ----
  - changeSet:
      id: 002-tenant-table
      author: oclyx
      comment: "Step -1: tenant table (minimal: id/name/created_date). Billing/quota columns intentionally omitted (YAGNI)."
      changes:
        - createTable:
            tableName: tenant
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP }

  - changeSet:
      id: 002-tenant-seed-default
      author: oclyx
      comment: "Default tenant row 1 (internal team dogfooding). name is a placeholder (UPDATE later)."
      changes:
        - insert:
            tableName: tenant
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: "Default Tenant" }

  # ---- tenant_id on each tenant-owned table: nullable add -> backfill=1 -> NOT NULL -> FK ----
  - changeSet:
      id: 002-tenant-col-products
      author: oclyx
      comment: "products.tenant_id: nullable add -> backfill=1 -> NOT NULL -> FK"
      changes:
        - addColumn:
            tableName: products
            columns:
              - column: { name: tenant_id, type: BIGINT }
        - update:
            tableName: products
            columns:
              - column: { name: tenant_id, valueNumeric: 1 }
        - addNotNullConstraint:
            tableName: products
            columnName: tenant_id
            columnDataType: BIGINT
        - addForeignKeyConstraint:
            constraintName: fk_products_tenant
            baseTableName: products
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id

  - changeSet:
      id: 002-tenant-col-seller
