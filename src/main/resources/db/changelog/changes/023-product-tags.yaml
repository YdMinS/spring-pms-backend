# Tag master+channel columns + push-time history (33): master_product.tags + product_listing.tags (JSON TEXT,
# nullable — merged at push time, channel-first then master appended) plus product_listing_tag_revision, an
# append-only merged-snapshot table (FK product_listing_id, no @TenantId — pure child scoped via the parent).
# All TEXT — the MySQL BIT trap does not apply (no boolean columns). Structured tags for H2<->MySQL portability.
databaseChangeLog:

  - changeSet:
      id: 023-product-tags
      author: oclyx
      comment: "33: master_product.tags + product_listing.tags (JSON TEXT, nullable) + product_listing_tag_revision (append-only merged snapshots)."
      changes:
        - addColumn:
            tableName: master_product
            columns:
              - column:
                  name: tags
                  type: TEXT
        - addColumn:
            tableName: product_listing
            columns:
              - column:
                  name: tags
                  type: TEXT
        - createTable:
            tableName: product_listing_tag_revision
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: product_listing_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: tags, type: TEXT }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_pltr_listing
            baseTableName: product_listing_tag_revision
            baseColumnNames: product_listing_id
            referencedTableName: product_listing
            referencedColumnNames: id
