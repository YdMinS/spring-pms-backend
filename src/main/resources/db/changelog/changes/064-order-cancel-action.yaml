# Pre-shipment order cancel audit trail (FEATURE_2609_25 / PLAN D8).
#   One row per ATTEMPT (success and failure alike). Cancelling at Coupang is irreversible and lowers the
#   seller score, so "who cancelled what, when, why, how many" has to survive somewhere. It is also the
#   only place the chosen reason survives for INSTRUCT lines — Coupang overwrites the reason there.
# ⚠️ NO UNIQUE constraint on purpose: retrying a failed cancel must be able to pile up rows.
# ⚠️ succeeded is BOOLEAN here and re-typed to BIT(1) for MySQL below: Liquibase's abstract BOOLEAN
#    materializes as TINYINT on MySQL while Hibernate 6 expects BIT -> ddl-auto: validate crashes the
#    app at boot. Same 006/058 pattern (project_thumbnail_boolean_bit_hotfix). H2 needs no follow-up.
# ⚠️ H2 constraint names are schema-global unique -> distinct names (fk_ordercancelaction_*).
databaseChangeLog:

  - changeSet:
      id: 064-order-cancel-action
      author: oclyx
      comment: "FEATURE_2609_25: order_cancel_action table (one row per cancel attempt, no UNIQUE)."
      changes:
        - createTable:
            tableName: order_cancel_action
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: order_item_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
              - column: { name: reason, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: platform_reason_code, type: VARCHAR(20) }
              - column: { name: status_at_send, type: VARCHAR(30) }
              - column: { name: succeeded, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: receipt_id, type: VARCHAR(50) }
              - column: { name: receipt_type, type: VARCHAR(20) }
              - column: { name: result_code, type: VARCHAR(50) }
              - column: { name: result_message, type: VARCHAR(1000) }
              - column: { name: created_by, type: VARCHAR(100) }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_ordercancelaction_tenant
            baseTableName: order_cancel_action
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_ordercancelaction_item
            baseTableName: order_cancel_action
            baseColumnNames: order_item_id
            referencedTableName: order_item
            referencedColumnNames: id
        - createIndex:
            tableName: order_cancel_action
            indexName: idx_ordercancelaction_item_succeeded
            columns:
              - column: { name: order_item_id }
              - column: { name: succeeded }
      rollback:
        - dropTable: { tableName: order_cancel_action }

  - changeSet:
      id: 064-order-cancel-action-boolean-bit-type
      author: oclyx
      dbms: mysql
      comment: "order_cancel_action.succeeded TINYINT -> BIT(1) to satisfy Hibernate schema validation."
      changes:
        - modifyDataType:
            tableName: order_cancel_action
            columnName: succeeded
            newDataType: BIT(1)
        # MySQL MODIFY drops NOT NULL, so re-declare it.
        - addNotNullConstraint:
            tableName: order_cancel_action
            columnName: succeeded
            columnDataType: BIT(1)
      rollback:
        - modifyDataType:
            tableName: order_cancel_action
            columnName: succeeded
            newDataType: BOOLEAN
