              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: platform, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: external_order_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: external_box_id, type: VARCHAR(100) }
              - column: { name: external_item_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: order_count, type: INT, constraints: { nullable: false } }
              - column: { name: cancel_count, type: INT, constraints: { nullable: false } }
              - column: { name: hold_count, type: INT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: paid_at, type: TIMESTAMP }
