# LotteON orders (FEATURE_2611_23 / D6 · D21 · D24 · D42 · D59 · D60 · D61 · D65 · R9).
#   132-1 lotteon_order_line = the LotteON mirror of one order_line (1:1, UNIQUE order_line_id). It owns the LotteON
#         natural key (marketplace_account_id, od_no, od_seq) — the neutral core gets no LotteON column (D6).
#         raw = the allow-listed fields of the order row only (D9): no address, contact or delivery message.
#   132-2 lotteon_cancel_request = one LotteON customer cancel request (claim number x order line, R9).
#         order_line_id stays NULL until the order line is loaded.
#   132-3 carrier_catalog LotteON courier codes (5 rows, D21).
#   132-4 lotteon_claim = the LotteON side of one order_claim (1:1, UNIQUE order_claim_id, D59 · D61).
#   132-5 customer_inquiry.title = the original title of a LotteON seller contact (D60).
#   The entities of 132-2 · 132-4 · 132-5 come with the later cancel / claim / inquiry work (D65).
# ⚠️ No true/false column -> the 006 BIT follow-up is not needed.
databaseChangeLog:

  - changeSet:
      id: 132-1-lotteon-order-line
      author: oclyx
      comment: "FEATURE_2611_23 D6: lotteon_order_line (LotteON mirror of order_line, natural key account+odNo+odSeq)."
      changes:
        - createTable:
            tableName: lotteon_order_line
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: order_line_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: od_no, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: od_seq, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: proc_seq, type: VARCHAR(10) }
              - column: { name: platform_status, type: VARCHAR(10) }
              - column: { name: spd_no, type: VARCHAR(50) }
              - column: { name: sitm_no, type: VARCHAR(50) }
              - column: { name: eitm_no, type: VARCHAR(50) }
              - column: { name: cmbn_dv_grp_no, type: VARCHAR(20) }
              - column: { name: raw, type: CLOB }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_orderline_tenant
            baseTableName: lotteon_order_line
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_orderline_line
            baseTableName: lotteon_order_line
            baseColumnNames: order_line_id
            referencedTableName: order_line
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_orderline_account
            baseTableName: lotteon_order_line
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_lotteon_order_line_line
            tableName: lotteon_order_line
            columnNames: order_line_id
        - addUniqueConstraint:
            constraintName: uq_lotteon_order_line
            tableName: lotteon_order_line
            columnNames: marketplace_account_id, od_no, od_seq
      rollback:
        - dropTable: { tableName: lotteon_order_line }

  - changeSet:
      id: 132-2-lotteon-cancel-request
      author: oclyx
      comment: "FEATURE_2611_23 D24 R9: lotteon_cancel_request (one row per LotteON claim number and order line)."
      changes:
        - createTable:
            tableName: lotteon_cancel_request
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: order_line_id, type: BIGINT }
              - column: { name: clm_no, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: od_no, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: od_seq, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: proc_seq, type: VARCHAR(10) }
              - column: { name: orgl_proc_seq, type: VARCHAR(10) }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
              - column: { name: reason_code, type: VARCHAR(20) }
              - column: { name: reason_text, type: VARCHAR(1000) }
              - column: { name: requested_at, type: TIMESTAMP }
              - column: { name: platform_status, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_cancelreq_tenant
            baseTableName: lotteon_cancel_request
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_cancelreq_account
            baseTableName: lotteon_cancel_request
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_cancelreq_line
            baseTableName: lotteon_cancel_request
            baseColumnNames: order_line_id
            referencedTableName: order_line
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_lotteon_cancel_request
            tableName: lotteon_cancel_request
            columnNames: marketplace_account_id, clm_no, od_seq
        - createIndex:
            tableName: lotteon_cancel_request
            indexName: idx_lotteon_cancelreq_order
            columns:
              - column: { name: marketplace_account_id }
              - column: { name: od_no }
              - column: { name: od_seq }
      rollback:
        - dropTable: { tableName: lotteon_cancel_request }

  - changeSet:
      id: 132-3-lotteon-carrier-catalog
      author: oclyx
      comment: "FEATURE_2611_23 D21: LotteON courier codes (5 rows)."
      changes:
        - sql:
            sql: >
              INSERT INTO carrier_catalog (platform, code, name, display_order) VALUES
              ('LOTTEON', '0002', 'CJ대한통운', 10),
              ('LOTTEON', '0001', '롯데택배', 20),
              ('LOTTEON', '0006', '한진택배', 30),
              ('LOTTEON', '0004', '우체국택배', 40),
              ('LOTTEON', '0005', '로젠택배', 50)
      rollback:
        - sql:
            sql: "DELETE FROM carrier_catalog WHERE platform = 'LOTTEON'"

  - changeSet:
      id: 132-4-lotteon-claim
      author: oclyx
      comment: "FEATURE_2611_23 D59 D61: lotteon_claim (LotteON side of one order_claim)."
      changes:
        - createTable:
            tableName: lotteon_claim
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: order_claim_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: proc_seq, type: VARCHAR(10) }
              - column: { name: orgl_proc_seq, type: VARCHAR(10) }
              - column: { name: hold_status, type: VARCHAR(10) }
              - column: { name: retrieval_informed_at, type: TIMESTAMP }
              - column: { name: reship_od_seq, type: VARCHAR(10) }
              - column: { name: reship_proc_seq, type: VARCHAR(10) }
              - column: { name: reship_informed_at, type: TIMESTAMP }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_claim_tenant
            baseTableName: lotteon_claim
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_lotteon_claim_order_claim
            baseTableName: lotteon_claim
            baseColumnNames: order_claim_id
            referencedTableName: order_claim
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_lotteon_claim_order_claim
            tableName: lotteon_claim
            columnNames: order_claim_id
      rollback:
        - dropTable: { tableName: lotteon_claim }

  - changeSet:
      id: 132-5-customer-inquiry-title
      author: oclyx
      comment: "FEATURE_2611_23 D60: customer_inquiry.title (original title of a LotteON seller contact)."
      changes:
        - addColumn:
            tableName: customer_inquiry
            columns:
              - column: { name: title, type: VARCHAR(100) }
      rollback:
        - dropColumn: { tableName: customer_inquiry, columnName: title }
