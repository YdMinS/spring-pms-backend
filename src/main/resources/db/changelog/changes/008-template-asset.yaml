# Template asset library (FEATURE_2608_05 Step 15): tenant-owned reusable fixed images (watermarks,
# badges) referenced by element.src. thumbnail_asset is @TenantId (tenant_id NOT NULL, no system rows,
# unlike font_asset). Structured tags only (no raw SQL) for H2<->MySQL portability.
databaseChangeLog:

  - changeSet:
      id: 008-thumbnail-asset
      author: oclyx
      comment: "Thumbnail asset library: tenant-owned reusable fixed images (element.src source)."
      changes:
        - createTable:
            tableName: thumbnail_asset
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: storage_key, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: content_type, type: VARCHAR(100) }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_thumbnail_asset_tenant
            baseTableName: thumbnail_asset
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
