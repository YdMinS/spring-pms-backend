# 11st shipping settings per sales channel (FEATURE_2610_13 / D84 · D104).
#   elevenst_shipping_config = the channel default of the 11st shipping fields, 1:1 with marketplace_account,
#   next to coupang_shipping_config. The values are ONE map (settings, JSON TEXT) whose keys are exactly the
#   master/listing override keys ("elevenst.*", ElevenstShippingKeys) — the three layers share one vocabulary.
# ⚠️ No boolean column -> the 006 BIT follow-up is not needed.
databaseChangeLog:

  - changeSet:
      id: 106-elevenst-shipping-config
      author: oclyx
      comment: "FEATURE_2610_13: elevenst_shipping_config (1:1 with marketplace_account, UNIQUE)."
      changes:
        - createTable:
            tableName: elevenst_shipping_config
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: settings, type: TEXT }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_elevenst_shipcfg_tenant
            baseTableName: elevenst_shipping_config
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_elevenst_shipcfg_account
            baseTableName: elevenst_shipping_config
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_elevenst_shipcfg_account
            tableName: elevenst_shipping_config
            columnNames: marketplace_account_id
      rollback:
        - dropTable: { tableName: elevenst_shipping_config }
