# Account credentials split out of the neutral core (FEATURE_2609_26 / PLAN D15).
#   marketplace_account carried Coupang's HMAC 4 fields (vendor_id·vendor_user_id·access_key·secret_key).
#   Naver needs client_id/client_secret + an EXPIRING OAuth token, which nullable columns on the shared core
#   cannot express — so the credentials move to a platform-owned table and the core stays neutral.
#   naver_account_credential is deliberately NOT created here (D22).
#
# 3 changesets on purpose (009·060 convention):
#   1. structure  — portable, runs on H2 apply-check too
#   2. backfill   — dbms:mysql, idempotent via a count = 0 precondition
#   3. dropColumn — separate so a backfill failure never leaves the source columns gone
# ⚠️ NEVER merge 2 and 3: the empty H2 apply-check skips the MySQL-only backfill, and a mixed changeset
#    would drop the source columns there with nothing copied.
#
# ⚠️ secret_key stays VARCHAR(512): the value is AES-GCM CIPHERTEXT (AesAttributeConverter), so a shorter
#    column truncates the backfill and every Coupang call then fails HMAC with a bare 401.
#
# ⚠️ Post-backfill check to run BY HAND — the two counts MUST be equal. Any difference → STOP and report;
#    no automatic cleanup (a silently missing credential surfaces only as a Coupang 401 later):
#      SELECT COUNT(*) FROM marketplace_account WHERE platform = 'COUPANG' AND vendor_id IS NOT NULL;
#      SELECT COUNT(*) FROM coupang_account_credential;
databaseChangeLog:

  # ---- 1. the credential table ----
  - changeSet:
      id: 065-coupang-account-credential
      author: oclyx
      comment: "FEATURE_2609_26: coupang_account_credential (1:1 with marketplace_account, UNIQUE)."
      changes:
        - createTable:
            tableName: coupang_account_credential
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: vendor_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: vendor_user_id, type: VARCHAR(100) }
              - column: { name: access_key, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: secret_key, type: VARCHAR(512), constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_coupang_cred_tenant
            baseTableName: coupang_account_credential
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_coupang_cred_account
            baseTableName: coupang_account_credential
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_coupang_cred_account
            tableName: coupang_account_credential
            columnNames: marketplace_account_id
      rollback:
        - dropTable: { tableName: coupang_account_credential }

  # ---- 2. one-off backfill of every existing Coupang account (MySQL only) ----
  # vendor_id is NOT NULL on marketplace_account and @NotBlank on the request DTO, so no row can be skipped.
  # ⚠️ Do NOT add further WHERE conditions — a narrowed filter loses accounts silently.
  # secret_key is copied as-is: the ciphertext moves, it is never decrypted here.
  - changeSet:
      id: 065-backfill-coupang-account-credential
      author: oclyx
      dbms: mysql
      comment: "기존 쿠팡 계정의 자격증명 4필드를 coupang_account_credential 로 1회 옮긴다."
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: "SELECT count(*) FROM coupang_account_credential"
      changes:
        - sql:
            sql: >
              INSERT INTO coupang_account_credential
                (marketplace_account_id, tenant_id, vendor_id, vendor_user_id, access_key, secret_key,
                 created_date, modified_date)
              SELECT id, tenant_id, vendor_id, vendor_user_id, access_key, secret_key, NOW(), NOW()
                FROM marketplace_account
               WHERE platform = 'COUPANG'
      rollback:
        - sql:
            sql: "DELETE FROM coupang_account_credential"

  # ---- 3. the core loses the Coupang columns ----
  - changeSet:
      id: 065-marketplace-account-drop-credentials
      author: oclyx
      comment: "marketplace_account 에서 쿠팡 HMAC 4필드 제거 — core 는 중립으로 남는다."
      changes:
        - dropColumn: { tableName: marketplace_account, columnName: vendor_id }
        - dropColumn: { tableName: marketplace_account, columnName: vendor_user_id }
        - dropColumn: { tableName: marketplace_account, columnName: access_key }
        - dropColumn: { tableName: marketplace_account, columnName: secret_key }
      rollback:
        - addColumn:
            tableName: marketplace_account
            columns:
              - column: { name: vendor_id, type: VARCHAR(100) }
              - column: { name: vendor_user_id, type: VARCHAR(100) }
              - column: { name: access_key, type: VARCHAR(255) }
              - column: { name: secret_key, type: VARCHAR(512) }
