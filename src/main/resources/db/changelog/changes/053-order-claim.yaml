# Claim (return/exchange) lines (FEATURE_2609_18 / PLAN §3 · D1).
#   order_claim is a sibling of order_item at the same granularity (one row per claimed line). Returns and
#   exchanges share it and are told apart by claim_type (D1) — what actually differs between them is the
#   processing action, which is out of scope for this stage (D4).
#   order_item_id is NULLABLE on purpose (D12): a claim whose order line cannot be matched is still a real
#   return we have to handle, so it is stored unlinked rather than dropped.
# ⚠️ PII: requester_name only (D19). No phone, no pickup address, no raw response column.
# ⚠️ No boolean column here -> the 006 MySQL BIT follow-up changeset is deliberately NOT needed.
# ⚠️ H2 constraint names are schema-global unique -> distinct names (fk_orderclaim_*, uq_orderclaim_*).
databaseChangeLog:

  - changeSet:
      id: 053-order-claim
      author: oclyx
      comment: "FEATURE_2609_18: order_claim table (return/exchange lines, order_item_id nullable)."
      changes:
        - createTable:
            tableName: order_claim
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: tenant_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: marketplace_account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: platform, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: claim_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: external_claim_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: external_order_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: external_box_id, type: VARCHAR(100) }
              - column: { name: external_item_id, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: order_item_id, type: BIGINT }
              - column: { name: order_item_match_attempts, type: INT, constraints: { nullable: false } }
              - column: { name: item_name, type: VARCHAR(500) }
              - column: { name: quantity, type: INT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: platform_status, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: reason_code, type: VARCHAR(100) }
              - column: { name: reason_text, type: VARCHAR(1000) }
              - column: { name: fault_type, type: VARCHAR(50) }
              - column: { name: return_shipping_charge, type: INT }
              - column: { name: collect_invoice_no, type: VARCHAR(100) }
              - column: { name: collect_carrier_code, type: VARCHAR(50) }
              - column: { name: reship_invoice_no, type: VARCHAR(100) }
              - column: { name: reship_carrier_code, type: VARCHAR(50) }
              - column: { name: requester_name, type: VARCHAR(100) }
              - column: { name: received_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: platform_modified_at, type: TIMESTAMP }
              - column: { name: synced_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: created_date, type: TIMESTAMP }
              - column: { name: modified_date, type: TIMESTAMP }
        - addForeignKeyConstraint:
            constraintName: fk_orderclaim_tenant
            baseTableName: order_claim
            baseColumnNames: tenant_id
            referencedTableName: tenant
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_orderclaim_account
            baseTableName: order_claim
            baseColumnNames: marketplace_account_id
            referencedTableName: marketplace_account
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_orderclaim_orderitem
            baseTableName: order_claim
            baseColumnNames: order_item_id
            referencedTableName: order_item
            referencedColumnNames: id
        - addUniqueConstraint:
            constraintName: uq_orderclaim_account_claim_item
            tableName: order_claim
            columnNames: marketplace_account_id, external_claim_id, external_item_id
        - createIndex:
            tableName: order_claim
            indexName: idx_orderclaim_account_status_received
            columns:
              - column: { name: marketplace_account_id }
              - column: { name: status }
              - column: { name: received_at }
      rollback:
        - dropTable: { tableName: order_claim }
