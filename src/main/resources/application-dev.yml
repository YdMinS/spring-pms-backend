# Development Profile
spring:
  datasource:
    # Sentinel defaults: env 미주입 시 context 로드 단계에서 죽지 않고 StartupEnvironmentValidator 가
    # "DB_URL/DB_USERNAME 필요" 라는 명확한 메시지로 부팅을 중단시키게 한다.
    url: ${DB_URL:__UNSET__}
    username: ${DB_USERNAME:__UNSET__}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    # Liquibase owns the schema on dev/prod. Baseline + future changesets applied at boot.
    enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # Liquibase owns the schema now; Hibernate only validates (was: update).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:__UNSET__}
  expiration: 1800000          # 30m
  refresh-expiration: 1209600000   # 14d
  prefix: Bearer

image:
  storage:
    uploadDir: /app/uploads/products

server:
  tomcat:
    max-http-post-size: 20971520
    max-swallow-size: 20971520
