# Development Profile
spring:
  datasource:
    # Sentinel defaults: env 미주입 시 context 로드 단계에서 죽지 않고 StartupEnvironmentValidator 가
    # "DB_URL/DB_USERNAME 필요" 라는 명확한 메시지로 부팅을 중단시키게 한다.
    url: ${DB_URL:__UNSET__}
    username: ${DB_USERNAME:__UNSET__}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 계정 병렬 동기화(동시 4~5)가 풀의 절반을 잡는다. Hikari 기본 10 은 빠듯하다.
      # ⚠️ 서버 자원 문제가 아니라 설정 문제다 — 인스턴스를 늘리는 답으로 가지 말 것(PLAN 2609_46 D11).
      maximum-pool-size: 20
  liquibase:
    # Liquibase owns the schema on dev/prod. Baseline + future changesets applied at boot.
    enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # Liquibase owns the schema now; Hibernate only validates (was: update).
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:__UNSET__}
  expiration: 1800000          # 30m
  refresh-expiration: 1209600000   # 14d
  prefix: Bearer

image:
  storage:
    type: s3
    uploadDir: /app/uploads/products
    s3:
      bucket: oclyx-product-images-dev
      region: ap-northeast-2
      keyPrefix: tenants

server:
  tomcat:
    max-http-post-size: 20971520
    max-swallow-size: 20971520

# 🔴 Every marketplace-calling schedule is OFF on dev ("-" = Spring's disabled-cron marker).
#
# Dev and prod run side by side on the same host and the dev DB holds the SAME Coupang vendor
# (A00611826). The outbound rate limiter (CoupangCallBudget) and the 429 cooldown circuit
# (CoupangRateLimitGuard) are per-process in-memory maps, so two containers each honouring 4/s
# look like 8/s to Coupang — over the per-vendor limit of 5/s. That is exactly what happened on
# 2026-09-16 09:15 KST: both schedulers fired on the same cron tick and prod took a 429 plus a
# 10-minute cooldown (FEATURE_2609_46 / PLAN D11, "instance count is the real limit").
#
# ⚠️ Do NOT re-enable these here. If dev ever needs a live marketplace round trip, use the manual
# button on a dev-only account — never a schedule that shares a vendor id with prod.
oclyx:
  order-sync:
    quick-cron: "-"
    full-cron: "-"
  settlement:
    revenue-sync-cron: "-"
    payout-sync-cron: "-"
