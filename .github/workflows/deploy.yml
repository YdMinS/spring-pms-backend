name: Deploy spring-pms-backend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ydmins/spring-pms-backend
  TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # Ship the Liquibase changelog to the server so the pre-deploy backup gate
      # can run `liquibase status`. The changelog lives inside app.jar (BOOT-INF)
      # at runtime, so there are no loose files on the server -> scp them here.
      # strip_components:3 drops "src/main/resources" -> lands as .../liquibase/db/...
      - name: Copy Liquibase changelog to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "src/main/resources/db/**"
          target: "/services/oklyx/liquibase"
          strip_components: 3

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            # ---- Liquibase pre-deploy backup gate (prod) ----
            # Backs up the DB ONLY when Liquibase has pending changesets (or when
            # `status` itself fails -> fail-safe). Runs BEFORE docker stop so the
            # dump captures the exact pre-migration state (app applies changesets
            # on boot). Subshell ( ... ) isolates `set +e` so it never pollutes the
            # errexit state of the docker stop/rm/pull/run steps below.
            (
            set +e
            set -o pipefail
            LB_DIR=/services/oklyx/liquibase
            DRIVER=/services/oklyx/mysql-connector-j.jar
            BK_DIR=/services/oklyx/db-backups
            mkdir -p "$BK_DIR"

            # Query pending changesets (read-only, does NOT touch the schema).
            STATUS=$(docker run --rm --network pms_network \
              -v "$LB_DIR/db:/liquibase/db" \
              -v "$DRIVER:/liquibase/lib/mysql-connector-j.jar" \
              liquibase/liquibase:4.27 \
              --driver=com.mysql.cj.jdbc.Driver \
              --url="jdbc:mysql://db-pms:3306/pms_db" \
              --username="${{ secrets.DB_USERNAME }}" \
              --password="${{ secrets.DB_PASSWORD }}" \
              --changeLogFile=db/changelog/db.changelog-master.yaml \
              status --verbose 2>&1); RC=$?
            echo "$STATUS"
            PENDING=$(echo "$STATUS" | grep -oiE '[0-9]+ changesets? (have|has) not been' | grep -oE '^[0-9]+' | head -1)
            PENDING=${PENDING:-0}

            # pending > 0 OR status failed (fail-safe) -> back up.
            if [ "$RC" -ne 0 ] || [ "$PENDING" -gt 0 ]; then
              echo "[backup] RC=$RC PENDING=$PENDING -> dumping prod DB"
              TS=$(date +%Y%m%d-%H%M%S)
              DUMP="$BK_DIR/pms_db-$TS.sql.gz"
              # Inject the password via MYSQL_PWD (avoids -p plaintext + "insecure" warning).
              # --no-tablespaces: dump user lacks PROCESS privilege (runbook §10). Do NOT
              # add --skip-comments/--compact: it removes the "-- Dump completed" marker
              # the integrity check below relies on.
              docker exec -e MYSQL_PWD="${{ secrets.DB_PASSWORD }}" db-pms sh -c \
                "mysqldump -u'${{ secrets.DB_USERNAME }}' --single-transaction --routines --triggers --no-tablespaces pms_db" \
                | gzip > "$DUMP"
              DUMP_RC=$?
              # Triple integrity check: (1) pipe succeeded (2) gzip intact (3) not empty (completion marker)
              if [ "$DUMP_RC" -ne 0 ]; then echo "[backup] mysqldump/pipe FAILED (rc=$DUMP_RC)"; exit 1; fi
              gzip -t "$DUMP" || { echo "[backup] gzip corrupt"; exit 1; }
              zcat "$DUMP" | tail -5 | grep -q 'Dump completed' \
                || { echo "[backup] empty/truncated dump (no completion marker)"; exit 1; }
              echo "[backup] OK: $DUMP ($(stat -c%s "$DUMP") bytes)"
              # Retain only the 10 most recent backups.
              ls -1t "$BK_DIR"/pms_db-*.sql.gz | tail -n +11 | xargs -r rm -f
            else
              echo "[backup] no pending changesets -> skip"
            fi
            ) || { echo "[backup] gate failed - aborting deploy"; exit 1; }
            # ---- end gate ----

            docker stop spring-pms-backend || true
            docker rm spring-pms-backend || true
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Ensure required networks exist (idempotent)
            docker network inspect pms_network >/dev/null 2>&1 || docker network create pms_network
            docker network inspect ydmins_proxy_network >/dev/null 2>&1 || docker network create ydmins_proxy_network

            docker run -d \
              --name spring-pms-backend \
              -p 8083:8083 \
              --network pms_network \
              -v /services/oklyx/uploads/products:/app/uploads/products \
              -e SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }} \
              -e DB_URL=jdbc:mysql://db-pms:3306/pms_db \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e OKLYX_CRYPTO_MASTER_KEY=${{ secrets.OKLYX_CRYPTO_MASTER_KEY }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:latest

            # Attach to the reverse-proxy network so nginx (api.oclyx.com) can reach the backend
            docker network connect ydmins_proxy_network spring-pms-backend

            docker logout ghcr.io

      - name: Verify deployment
        run: echo "Deployment to spring-pms-backend completed successfully"
